# Font & Text
font_family      monospace
font_size        11.0
adjust_line_height 105%
cursor_shape     beam
cursor_blink_interval 0.5

# Window Layout & Padding
remember_window_size  yes
initial_window_width  1000
initial_window_height 600
window_padding_width  15
window_margin_width   0
hide_window_decorations yes
confirm_os_window_close 0

# Opacity & Blur (Matching your Sway aesthetic)
background_opacity 0.90
dynamic_background_opacity yes

# Tab Bar (Clean & Minimal)
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background   #0055aa
active_tab_foreground   #ffffff
inactive_tab_background #001122
inactive_tab_foreground #888888

# Color Scheme (Deep Ocean / Custom Blue)
foreground              #c0caf5
background              #001122
selection_foreground    #001122
selection_background    #0055aa

# Black / Dark Grey
color0  #15161e
color8  #414868

# Red
color1  #f7768e
color9  #f7768e

